[package]
name = "dfc-core"
description = "Safe Rust bindings for dfc-core DESFire credentials, emulation, and readers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["bundled", "role-simulator", "profile-full-ev3"]
bundled = ["dfc-core-sys/bundled"]
system = ["dfc-core-sys/system"]
role-simulator = ["dfc-core-sys/role-simulator"]
role-host = ["dfc-core-sys/role-host"]
role-target = ["dfc-core-sys/role-target"]
profile-minimal-ev1 = ["dfc-core-sys/profile-minimal-ev1"]
profile-full-ev1 = ["dfc-core-sys/profile-full-ev1"]
profile-full-ev2 = ["dfc-core-sys/profile-full-ev2"]
profile-full-ev3 = ["dfc-core-sys/profile-full-ev3"]
profile-minimal-ev3 = ["dfc-core-sys/profile-minimal-ev3"]

[dependencies]
dfc-core-sys = { path = "../../..", version = "2.0.0", default-features = false }

[lints]
workspace = true

