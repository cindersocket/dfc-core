name: CI

on:
  push:
  pull_request:

# Run both tiny libraries with pinned revisions, plain and under sanitizers.
jobs:
  unit:
    name: Unit suite${{ matrix.sanitize && format(' ({0})', matrix.sanitize) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sanitize: "", cc: gcc }
          - { sanitize: "address,undefined", cc: gcc }
          - { sanitize: "memory", cc: clang }
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-rt-18-dev
      - name: Fetch tiny-aes-c
        uses: actions/checkout@v4
        with:
          repository: mistial-dev/tiny-aes-c
          ref: 4258d2aebf19d581571dc80e609b7b3f256ccdf4
          path: dependencies/tiny-aes-c
      - name: Fetch tiny-des-c
        uses: actions/checkout@v4
        with:
          repository: mistial-dev/tiny-des-c
          ref: f960831f4da27149525383ef0b9d11938e95faf3
          path: dependencies/tiny-des-c
      - run: make -C tests test TINY_AES_DIR=../dependencies/tiny-aes-c TINY_DES_DIR=../dependencies/tiny-des-c CC=${{ matrix.cc }} SANITIZE=${{ matrix.sanitize }}
